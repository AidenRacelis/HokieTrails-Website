# JWT signing secret shared by the backend services.
# In production create this with:
#   kubectl -n hokietrails create secret generic hokie-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: hokie-secrets
  namespace: hokietrails
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production"
