# Ingress exposing the frontend and the API gateway on one host.
# Requires an ingress controller (e.g. ingress-nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hokietrails-ingress
  namespace: hokietrails
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: hokietrails.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
