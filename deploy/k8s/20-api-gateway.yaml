apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: hokietrails
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      sendfile on;
      keepalive_timeout 65;
      upstream auth_service    { server auth-service:5000; }
      upstream trails_service  { server trails-service:5000; }
      upstream housing_service { server housing-service:5000; }
      server {
        listen 8080;
        location /api/auth/ {
          proxy_pass http://auth_service;
          proxy_set_header Host $host;
        }
        location /api/trails/ {
          proxy_pass http://trails_service;
          proxy_set_header Host $host;
        }
        location /api/housing/ {
          proxy_pass http://housing_service;
          proxy_set_header Host $host;
        }
        location /health {
          return 200 'gateway ok';
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hokietrails
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hokietrails
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
