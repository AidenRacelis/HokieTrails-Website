apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hokietrails
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build with the public API URL baked in, e.g.:
          #   docker build \
          #     --build-arg NEXT_PUBLIC_API_URL=https://api.hokietrails.example \
          #     -t hokietrails/frontend:latest frontend/hokie-trails
          image: hokietrails/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hokietrails
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
