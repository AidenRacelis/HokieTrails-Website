apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trails-data
  namespace: hokietrails
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trails-service
  namespace: hokietrails
  labels:
    app: trails-service
spec:
  # Kept at 1 replica because the JSON store uses a ReadWriteOnce volume.
  # To scale horizontally, point the storage layer at a shared database
  # (see hokietrails/storage.py) and raise this value.
  replicas: 1
  selector:
    matchLabels:
      app: trails-service
  template:
    metadata:
      labels:
        app: trails-service
    spec:
      containers:
        - name: trails
          image: hokietrails/backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: "trails"
            - name: DATA_DIR
              value: "/data"
            - name: CORS_ORIGINS
              value: "*"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hokie-secrets
                  key: SECRET_KEY
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trails-data
---
apiVersion: v1
kind: Service
metadata:
  name: trails-service
  namespace: hokietrails
spec:
  selector:
    app: trails-service
  ports:
    - port: 5000
      targetPort: 5000
