# API gateway for the HokieTrails microservices.
# Routes each /api/<service> path prefix to the matching backend container.
# Used by both docker-compose (as the `api-gateway` service) and referenced by
# the Kubernetes ingress rules.

worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  keepalive_timeout 65;

  # Service hostnames resolve via docker-compose / k8s service DNS.
  upstream auth_service    { server auth-service:5000; }
  upstream trails_service  { server trails-service:5000; }
  upstream housing_service { server housing-service:5000; }

  server {
    listen 8080;

    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/trails/ {
      proxy_pass http://trails_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/housing/ {
      proxy_pass http://housing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      return 200 'gateway ok';
      add_header Content-Type text/plain;
    }
  }
}
